<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherVault - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0284c7);
            background-size: 400% 400%; animation: auraBG 12s ease infinite;
        }
        @keyframes auraBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .card {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px;
            padding: 40px; width: 100%; max-width: 380px; color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 24px; text-align: center; font-size: 26px; letter-spacing: -0.5px; }
        input {
            width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05);
            color: #fff; outline: none; font-size: 15px;
        }
        button {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #38bdf8, #818cf8); color: #fff;
            font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        .alert { color: #f87171; font-size: 14px; margin-bottom: 16px; text-align: center; }
        a { color: #38bdf8; text-decoration: none; display: block; text-align: center; margin-top: 18px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AetherVault Access</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="alert">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <a href="/signup">Don't have an account? Sign up</a>
    </div>
</body>
  </html>
